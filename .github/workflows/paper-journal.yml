name: SPY paper journal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-journal.yml"
      - "intraday/hosted.py"
      - "tests/test_hosted.py"
  workflow_dispatch:
    inputs:
      stage:
        description: Run stage
        type: choice
        options: [check, open, close]
        default: check
  schedule:
    - cron: "38 9 * * 1-5"
      timezone: America/New_York
    - cron: "27 16 * * 1-5"
      timezone: America/New_York

permissions:
  contents: read
concurrency:
  group: spy-paper-journal
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      STAGE: ${{ inputs.stage || (github.event.schedule == '38 9 * * 1-5' && 'open') || (github.event.schedule == '27 16 * * 1-5' && 'close') || 'check' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - if: env.STAGE == 'check'
        run: python -m unittest discover -s tests -v
      - name: Read feed and record observation
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [[ -z "$APCA_API_KEY_ID" || -z "$APCA_API_SECRET_KEY" ]]; then
            echo 'Waiting for Alpaca paper credentials. No feed was contacted.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$STAGE" == check ]]; then exit 0; fi
            exit 1
          fi
          python -m intraday.hosted "$STAGE"
          echo "Completed stage: $STAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish captured observations
        if: ${{ !cancelled() && env.STAGE != 'check' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- 'forward'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record SPY paper journal ($STAGE)"
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main
